spring:
  application:
    name: eventhub

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventhub}
    username: ${DB_USERNAME:eventhub}
    password: ${DB_PASSWORD:eventhub}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    redis:
      time-to-live: 10m
      cache-null-values: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  scheduling:
    event-status:
      fixed-delay-ms: ${EVENT_STATUS_SCHEDULER_DELAY_MS:60000}

  jwt:
    secret: ${JWT_SECRET:eventhub-local-development-secret-key-change-me-minimum-32-characters}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:20}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
